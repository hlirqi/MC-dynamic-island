// ============================================================
//  Gradle 国内镜像加速（可选）
//  用法：把本文件复制（或移动）到
//        Windows: C:\Users\<你的用户名>\.gradle\init.d\
//        Linux/Mac: ~/.gradle/init.d/
//  文件名保持 .gradle 后缀即可，Gradle 启动会自动加载。
//  不需要加速时直接删掉该文件。
// ============================================================

def ALI_PUBLIC = 'https://maven.aliyun.com/repository/public'
def ALI_PLUGIN = 'https://maven.aliyun.com/repository/gradle-plugin'
def FORGE_REPO = 'https://maven.minecraftforge.net/'

allprojects {
    buildscript {
        repositories {
            maven { url ALI_PLUGIN }
            maven { url ALI_PUBLIC }
            maven { url FORGE_REPO }
            mavenCentral { url ALI_PUBLIC }
        }
    }
    repositories {
        maven { url ALI_PUBLIC }
        maven { url FORGE_REPO }
    }
}

settingsEvaluated { settings ->
    settings.pluginManagement {
        repositories {
            maven { url ALI_PLUGIN }
            maven { url FORGE_REPO }
            gradlePluginPortal()
        }
    }
}
